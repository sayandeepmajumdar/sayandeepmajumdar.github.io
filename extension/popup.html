<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolzy Quick Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("toolbox:theme") || localStorage.getItem("theme-mode");
        var isDark = mode === "dark" || (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      width: 420px;
      min-height: 480px;
      max-height: 590px;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-paper text-ink selection:bg-accent/20 selection:text-accent font-sans antialiased">
  <div id="popup-root"></div>
  <script type="module" src="./popup.tsx"></script>
</body>
</html>
