<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architecture Diagram Studio — Visual Cloud &amp; System Architecture Designer | sayandeep.dev</title>
  <meta name="description" content="Free online architecture diagram editor. Design AWS, GCP, Azure, and microservices cloud infrastructure diagrams with drag-and-drop nodes, VPC containers, protocol connectors, live JSON sync, and PNG/SVG export." />
  <meta name="keywords" content="architecture diagram editor, cloud architecture designer, aws diagram maker, gcp diagram, azure architecture, microservices diagram, system design tool" />
  <link rel="canonical" href="https://sayandeepmajumdar.github.io/architecture-diagram/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-rgb: 255, 255, 255;
      --surface-alt: #f5f5f4;
      --text: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      --track-bg: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --transition: 0.2s ease;
    }

    html.dark {
      --bg: #0c0a09;
      --surface: #1c1917;
      --surface-rgb: 28, 25, 23;
      --surface-alt: #292524;
      --text: #fafaf9;
      --muted: #a8a29e;
      --line: #292524;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-light: rgba(129, 140, 248, 0.12);
      --track-bg: #44403c;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.15);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background-color: rgba(var(--surface-rgb), 0.95);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 40;
    }

    header .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }

    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
      background: var(--accent-light);
      color: var(--accent);
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all var(--transition);
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn--primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    .btn--danger { color: var(--error); }
    .btn--danger:hover { background: var(--error-bg); border-color: var(--error); }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .icon-sun { display: none; }
    .icon-moon { display: block; }
    html.dark .icon-sun { display: block; }
    html.dark .icon-moon { display: none; }

    .nav-back-link {
      font-size: 0.775rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .nav-back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .form-select, .form-input {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--text);
      outline: none;
    }

    .form-select:focus, .form-input:focus {
      border-color: var(--accent);
    }

    /* Workspace Layout */
    .studio-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      height: calc(100vh - 48px);
      min-height: 0;
      background: var(--bg);
      position: relative;
    }

    /* Left Sidebar: Component Palette */
    .sidebar-left {
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.75rem;
      gap: 0.75rem;
    }

    .palette-search {
      width: 100%;
      padding: 0.4rem 0.6rem;
      font-size: 0.775rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--text);
      outline: none;
    }

    .palette-tabs {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .tab-btn {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      overflow-y: auto;
    }

    .palette-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.6rem 0.4rem;
      border-radius: var(--radius-sm);
      background: var(--surface-alt);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      user-select: none;
    }

    .palette-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .palette-item .icon { font-size: 1.35rem; }
    .palette-item .name { font-size: 0.675rem; font-weight: 600; line-height: 1.2; }

    /* Center Canvas Viewport */
    .canvas-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: grab;
    }

    html.dark .canvas-viewport {
      background-color: #09090b;
      background-image: radial-gradient(#27272a 1px, transparent 1px);
    }

    .canvas-viewport.grabbing { cursor: grabbing; }

    .canvas-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 4000px;
      transform-origin: 0 0;
      pointer-events: none;
    }

    .canvas-stage > * { pointer-events: auto; }

    /* SVG Connectors Layer */
    .connections-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Container Box (VPC/Subnet) */
    .arch-container {
      position: absolute;
      border: 2px dashed #94a3b8;
      border-radius: var(--radius-md);
      background: rgba(241, 245, 249, 0.45);
      z-index: 1;
      cursor: move;
      user-select: none;
      transition: border-color 0.15s;
    }

    html.dark .arch-container {
      border-color: #475569;
      background: rgba(30, 41, 59, 0.35);
    }

    .arch-container.selected {
      border-color: var(--accent);
      border-style: solid;
    }

    .container-header {
      position: absolute;
      top: -12px;
      left: 12px;
      background: #475569;
      color: #ffffff;
      font-size: 0.675rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Node Card */
    .arch-node {
      position: absolute;
      width: 140px;
      min-height: 70px;
      padding: 0.6rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.25rem;
      cursor: grab;
      user-select: none;
      z-index: 10;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .arch-node.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light), var(--shadow-md);
    }

    .arch-node .node-icon { font-size: 1.35rem; }
    .arch-node .node-title { font-size: 0.75rem; font-weight: 700; color: var(--text); line-height: 1.2; word-break: break-word; }
    .arch-node .node-sub { font-size: 0.65rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* Right Sidebar: Inspector */
    .sidebar-right {
      background: var(--surface);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.75rem;
      gap: 1rem;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .prop-row {
      display: grid;
      grid-template-columns: 75px 1fr;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.775rem;
    }

    /* Bottom Code Drawer */
    .bottom-code-drawer {
      position: absolute;
      bottom: 0;
      left: 280px;
      right: 280px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 180px;
      z-index: 30;
      box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }

    .bottom-code-drawer.collapsed {
      transform: translateY(calc(100% - 32px));
    }

    .drawer-header {
      height: 32px;
      padding: 0 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface-alt);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .code-textarea {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      line-height: 1.5;
      padding: 0.75rem;
      border: none;
      background: var(--surface);
      color: var(--text);
      outline: none;
      resize: none;
      overflow: auto;
      white-space: pre;
    }

    /* Floating Zoom Controls */
    .zoom-toolbar {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      box-shadow: var(--shadow-md);
      z-index: 20;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="./" class="brand" aria-label="Architecture Diagram Studio">
        <span class="brand-badge">ARCH</span>
        <span class="brand-title">Architecture Diagram Studio</span>
      </a>

      <div class="header-actions">
        <select id="select-template" class="form-select">
          <option value="" disabled selected>✨ Templates...</option>
          <option value="three_tier">🌐 3-Tier Web App</option>
          <option value="serverless">⚡ Serverless Event API</option>
          <option value="k8s">☸️ Microservices on K8s</option>
          <option value="data">📊 Real-Time Data Lakehouse</option>
          <option value="hybrid">🏢 Hybrid Cloud &amp; VPN</option>
        </select>
        <button class="btn btn--sm" id="btn-new">📄 New</button>
        <button class="btn btn--sm" id="btn-share-url">🔗 Share</button>
        <button class="btn btn--sm" id="btn-copy-mermaid">📋 Mermaid</button>
        <button class="btn btn--sm" id="btn-export-json">💾 JSON</button>
        <button class="btn btn--sm btn--primary" id="btn-export-svg">💾 SVG</button>
        <button class="btn btn--sm" id="btn-export-png">🖼️ PNG (2x)</button>

        <button id="theme-toggle" class="btn-icon" aria-label="Toggle Dark Mode" title="Toggle Theme" style="margin-left:0.4rem;">
          <svg class="icon-sun" width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
          <svg class="icon-moon" width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </button>
        <a href="../tools/" class="nav-back-link">← Back</a>
      </div>
    </div>
  </header>

  <!-- Studio Workspace -->
  <div class="studio-workspace">
    <!-- Left Sidebar: Component Palette -->
    <aside class="sidebar-left">
      <input type="text" id="palette-search" class="palette-search" placeholder="🔍 Search components..." />

      <div class="palette-tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="generic">Generic</button>
        <button class="tab-btn" data-tab="aws">AWS</button>
        <button class="tab-btn" data-tab="gcp">GCP</button>
        <button class="tab-btn" data-tab="azure">Azure</button>
        <button class="tab-btn" data-tab="containers">VPC/Boxes</button>
      </div>

      <div class="palette-grid" id="palette-grid">
        <!-- Injected Components -->
      </div>
    </aside>

    <!-- Center Canvas Area -->
    <div class="canvas-viewport" id="canvas-viewport">
      <div class="canvas-stage" id="canvas-stage">
        <!-- SVG Connections Layer -->
        <svg class="connections-svg" id="connections-svg"></svg>
        <!-- Containers Layer -->
        <div id="containers-layer"></div>
        <!-- Nodes Layer -->
        <div id="nodes-layer"></div>
      </div>

      <!-- Floating Zoom Controls -->
      <div class="zoom-toolbar">
        <button class="btn btn--sm" id="btn-zoom-out">−</button>
        <span style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; font-weight:700; padding:0 0.3rem;" id="zoom-lbl">100%</span>
        <button class="btn btn--sm" id="btn-zoom-in">+</button>
        <button class="btn btn--sm" id="btn-zoom-reset">Fit</button>
      </div>
    </div>

    <!-- Right Sidebar: Inspector & Connector -->
    <aside class="sidebar-right">
      <!-- Node / Container Inspector -->
      <div class="sidebar-section" id="inspector-section">
        <span class="sidebar-title">Selected Element</span>
        <div style="display:flex; flex-direction:column; gap:0.5rem;" id="inspector-fields">
          <div class="prop-row">
            <label>Title</label>
            <input type="text" id="prop-title" class="form-input" placeholder="Component Title..." />
          </div>
          <div class="prop-row">
            <label>Sublabel</label>
            <input type="text" id="prop-sublabel" class="form-input" placeholder="e.g. 10.0.1.0/24 or Port 443" />
          </div>
          <div class="prop-row">
            <label>Icon</label>
            <input type="text" id="prop-icon" class="form-input" style="width:50px; text-align:center;" />
          </div>
          <button class="btn btn--danger" id="btn-delete-element" style="margin-top:0.4rem;">🗑️ Delete Element</button>
        </div>
      </div>

      <!-- Edge Connector Builder -->
      <div class="sidebar-section" style="border-top:1px solid var(--line); padding-top:0.75rem;">
        <span class="sidebar-title">Connect Nodes</span>
        <div style="display:flex; flex-direction:column; gap:0.4rem;">
          <select id="edge-from" class="form-select">
            <option value="" disabled selected>Source Node...</option>
          </select>
          <select id="edge-to" class="form-select">
            <option value="" disabled selected>Target Node...</option>
          </select>
          <select id="edge-style" class="form-select">
            <option value="solid" selected>Solid Line (Sync)</option>
            <option value="dashed">Dashed Line (Async / Event)</option>
            <option value="dotted">Dotted Line (Telemetry / Log)</option>
          </select>
          <input type="text" id="edge-label" class="form-input" placeholder="Protocol (e.g. HTTPS, gRPC, SQL)..." />
          <button class="btn btn--primary" id="btn-add-edge" style="margin-top:0.25rem;">+ Connect Nodes</button>
        </div>
      </div>

      <!-- Active Edges List -->
      <div class="sidebar-section" style="border-top:1px solid var(--line); padding-top:0.75rem;">
        <span class="sidebar-title">Connections</span>
        <div style="display:flex; flex-direction:column; gap:0.35rem; max-height:180px; overflow-y:auto;" id="edges-list">
          <!-- Injected Active Connections -->
        </div>
      </div>
    </aside>
  </div>

  <!-- Bottom Code Drawer (Synced JSON) -->
  <div class="bottom-code-drawer collapsed" id="code-drawer">
    <div class="drawer-header" id="drawer-toggle-btn">
      <span>💻 Synced Diagram JSON Schema</span>
      <span id="drawer-toggle-icon">▲ Open</span>
    </div>
    <textarea id="code-textarea" class="code-textarea" spellcheck="false"></textarea>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <span id="toast-icon">✓</span>
    <span id="toast-msg">Copied to clipboard!</span>
  </div>

  <script>
    // Theme Switcher
    let isDarkMode = false;
    (function initTheme() {
      const mode = localStorage.getItem('theme-mode');
      isDarkMode = mode ? mode === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDarkMode) document.documentElement.classList.add('dark');

      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.addEventListener('click', () => {
          isDarkMode = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme-mode', isDarkMode ? 'dark' : 'light');
          renderCanvas();
        });
      }
    })();

    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // --- COMPONENT LIBRARY DEFINITIONS ---
    const PALETTE_COMPONENTS = [
      // Generic

    // --- RENDER COMPONENT PALETTE ---
    function renderPalette(filter = '', category = 'all') {
      const q = filter.toLowerCase().trim();
      const filtered = PALETTE_COMPONENTS.filter(c => {
        const matchCat = category === 'all' || c.cat === category;
        const matchQuery = !q || c.name.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      paletteGrid.innerHTML = filtered.map(c => `
        <div class="palette-item" onclick="addComponentToCanvas('${c.id}')">
          <span class="icon">${c.icon}</span>
          <span class="name">${c.name}</span>
        </div>
      `).join('');
    }

    paletteSearch.addEventListener('input', (e) => {
      const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'all';
      renderPalette(e.target.value, activeTab);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPalette(paletteSearch.value, btn.dataset.tab);
      });
    });

    // --- ADD COMPONENT TO CANVAS ---
    window.addComponentToCanvas = function(compId) {
      const comp = PALETTE_COMPONENTS.find(c => c.id === compId);
      if (!comp) return;

      const randomX = Math.round((-panOffset.x + 320 + Math.random() * 100) / currentZoom);
      const randomY = Math.round((-panOffset.y + 180 + Math.random() * 100) / currentZoom);

      if (comp.isContainer) {
        const newId = `c_${Date.now()}`;
        diagramState.containers.push({
          id: newId,
          title: comp.name,
          x: randomX,
          y: randomY,
          w: 360,
          h: 240
        });
        selectElement('container', newId);
      } else {
        const newId = `n_${Date.now()}`;
        diagramState.nodes.push({
          id: newId,
          title: comp.name,
          sub: comp.sub,
          icon: comp.icon,
          x: randomX,
          y: randomY
        });
        selectElement('node', newId);
      }

      renderCanvas();
      showToast(`Added ${comp.name}`);
    };

    // --- RENDER CANVAS & CONNECTIONS ---
    function renderCanvas() {
      // 1. Render Containers
      containersLayer.innerHTML = diagramState.containers.map(c => `
        <div class="arch-container ${selectedElement?.id === c.id ? 'selected' : ''}" id="${c.id}"
             style="left:${c.x}px; top:${c.y}px; width:${c.w}px; height:${c.h}px;"
             onmousedown="startDragElement(event, 'container', '${c.id}')">
          <div class="container-header">${c.title}</div>
        </div>
      `).join('');

      // 2. Render Nodes
      nodesLayer.innerHTML = diagramState.nodes.map(n => `
        <div class="arch-node ${selectedElement?.id === n.id ? 'selected' : ''}" id="${n.id}"
             style="left:${n.x}px; top:${n.y}px;"
             onmousedown="startDragElement(event, 'node', '${n.id}')">
          <span class="node-icon">${n.icon}</span>
          <span class="node-title">${n.title}</span>
          <span class="node-sub">${n.sub}</span>
        </div>
      `).join('');

      // 3. Render SVG Connections
      renderConnectionsSvg();

      // 4. Update Dropdowns & JSON Drawer
      populateDropdowns();
      codeTextarea.value = JSON.stringify(diagramState, null, 2);
      localStorage.setItem('arch_diagram_autosave', JSON.stringify(diagramState));
    }

    function renderConnectionsSvg() {
      const isDark = document.documentElement.classList.contains('dark');
      const strokeColor = isDark ? '#94a3b8' : '#475569';
      const labelBg = isDark ? '#1c1917' : '#ffffff';
      const labelText = isDark ? '#fafaf9' : '#1c1917';

      let svgHtml = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="${strokeColor}" />
          </marker>
        </defs>
      `;

      diagramState.edges.forEach((e, idx) => {
        const fromNode = diagramState.nodes.find(n => n.id === e.from);
        const toNode = diagramState.nodes.find(n => n.id === e.to);
        if (!fromNode || !toNode) return;

        const x1 = fromNode.x + 70;
        const y1 = fromNode.y + 35;
        const x2 = toNode.x + 70;
        const y2 = toNode.y + 35;

        // Orthogonal / Bezier Path
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const pathData = `M ${x1} ${y1} Q ${midX} ${y1} ${midX} ${midY} T ${x2} ${y2}`;

        const strokeDash = e.style === 'dashed' ? '6,6' : (e.style === 'dotted' ? '2,4' : 'none');

        svgHtml += `
          <g>
            <path d="${pathData}" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-dasharray="${strokeDash}" marker-end="url(#arrow)" />
            ${e.label ? `
              <rect x="${midX - 35}" y="${midY - 10}" width="70" height="20" rx="4" fill="${labelBg}" stroke="${strokeColor}" stroke-width="1" />
              <text x="${midX}" y="${midY + 4}" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="${labelText}" text-anchor="middle">${e.label}</text>
            ` : ''}
          </g>
        `;
      });

      connectionsSvg.innerHTML = svgHtml;

      // Render Edges Sidebar list
      edgesList.innerHTML = diagramState.edges.map((e, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-alt); padding:0.35rem 0.5rem; border-radius:var(--radius-sm); font-size:0.75rem; border:1px solid var(--line);">
          <span><strong>${e.from}</strong> ➔ <strong>${e.to}</strong> ${e.label ? `<small>(${e.label})</small>` : ''}</span>
          <button class="btn btn--sm btn--danger" onclick="deleteEdge(${idx})">✕</button>
        </div>
      `).join('');
    }

    function populateDropdowns() {
      const opts = diagramState.nodes.map(n => `<option value="${n.id}">${n.title} (${n.id})</option>`).join('');
      edgeFrom.innerHTML = '<option value="" disabled selected>Source Node...</option>' + opts;
      edgeTo.innerHTML = '<option value="" disabled selected>Target Node...</option>' + opts;
    }

    // --- ELEMENT SELECTION & DRAGGING ---
    window.selectElement = function(type, id) {
      selectedElement = { type, id };
      if (type === 'node') {
        const node = diagramState.nodes.find(n => n.id === id);
        if (node) {
          propTitle.value = node.title;
          propSublabel.value = node.sub;
          propIcon.value = node.icon;
          propIcon.style.display = 'block';
        }
      } else if (type === 'container') {
        const container = diagramState.containers.find(c => c.id === id);
        if (container) {
          propTitle.value = container.title;
          propSublabel.value = `${container.w} × ${container.h} px`;
          propIcon.style.display = 'none';
        }
      }
    };

    let draggingObj = null;
    let dragStartMouse = { x: 0, y: 0 };
    let dragStartPos = { x: 0, y: 0 };

    window.startDragElement = function(e, type, id) {
      e.stopPropagation();
      selectElement(type, id);
      renderCanvas();

      draggingObj = { type, id };
      dragStartMouse = { x: e.clientX, y: e.clientY };

      const item = type === 'node' ? diagramState.nodes.find(n => n.id === id) : diagramState.containers.find(c => c.id === id);
      if (item) {
        dragStartPos = { x: item.x, y: item.y };
      }
    };

    window.addEventListener('mousemove', (e) => {
      if (draggingObj) {
        const dx = (e.clientX - dragStartMouse.x) / currentZoom;
        const dy = (e.clientY - dragStartMouse.y) / currentZoom;

        const item = draggingObj.type === 'node'
          ? diagramState.nodes.find(n => n.id === draggingObj.id)
          : diagramState.containers.find(c => c.id === draggingObj.id);

        if (item) {
          item.x = Math.round(dragStartPos.x + dx);
          item.y = Math.round(dragStartPos.y + dy);
          renderCanvas();
        }
      } else if (isPanning) {
        panOffset.x = e.clientX - panStart.x;
        panOffset.y = e.clientY - panStart.y;
        applyTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      draggingObj = null;
      isPanning = false;
      canvasViewport.classList.remove('grabbing');
    });

    // Inspector Updates
    propTitle.addEventListener('input', (e) => {
      if (!selectedElement) return;
      if (selectedElement.type === 'node') {
        const n = diagramState.nodes.find(node => node.id === selectedElement.id);
        if (n) n.title = e.target.value;
      } else {
        const c = diagramState.containers.find(box => box.id === selectedElement.id);
        if (c) c.title = e.target.value;
      }
      renderCanvas();
    });

    propSublabel.addEventListener('input', (e) => {
      if (!selectedElement || selectedElement.type !== 'node') return;
      const n = diagramState.nodes.find(node => node.id === selectedElement.id);
      if (n) n.sub = e.target.value;
      renderCanvas();
    });

    propIcon.addEventListener('input', (e) => {
      if (!selectedElement || selectedElement.type !== 'node') return;
      const n = diagramState.nodes.find(node => node.id === selectedElement.id);
      if (n) n.icon = e.target.value;
      renderCanvas();
    });

    document.getElementById('btn-delete-element').addEventListener('click', () => {
      if (!selectedElement) return;
      if (selectedElement.type === 'node') {
        diagramState.nodes = diagramState.nodes.filter(n => n.id !== selectedElement.id);
        diagramState.edges = diagramState.edges.filter(e => e.from !== selectedElement.id && e.to !== selectedElement.id);
      } else {
        diagramState.containers = diagramState.containers.filter(c => c.id !== selectedElement.id);
      }
      selectedElement = null;
      renderCanvas();
      showToast('Deleted element');
    });

    // Add Edge
    document.getElementById('btn-add-edge').addEventListener('click', () => {
      const from = edgeFrom.value;
      const to = edgeTo.value;
      const style = edgeStyle.value;
      const label = edgeLabel.value.trim();

      if (!from || !to) {
        showToast('Select source and target nodes');
        return;
      }

      diagramState.edges.push({ from, to, style, label });
      edgeLabel.value = '';
      renderCanvas();
      showToast(`Connected ${from} ➔ ${to}`);
    });

    window.deleteEdge = function(idx) {
      diagramState.edges.splice(idx, 1);
      renderCanvas();
      showToast('Removed connection');
    };

    // Pan & Zoom
    function applyTransform() {
      canvasStage.style.transform = `translate(${panOffset.x}px, ${panOffset.y}px) scale(${currentZoom})`;
      zoomLbl.textContent = `${Math.round(currentZoom * 100)}%`;
    }

    btnZoomIn.addEventListener('click', () => {
      currentZoom = Math.min(2.5, currentZoom + 0.2);
      applyTransform();
    });

    btnZoomOut.addEventListener('click', () => {
      currentZoom = Math.max(0.3, currentZoom - 0.2);
      applyTransform();
    });

    btnZoomReset.addEventListener('click', () => {
      currentZoom = 1;
      panOffset = { x: 40, y: 40 };
      applyTransform();
      showToast('Reset viewport');
    });

    canvasViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      currentZoom = Math.max(0.3, Math.min(2.5, currentZoom + delta));
      applyTransform();
    });

    canvasViewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.arch-node') || e.target.closest('.arch-container') || e.target.closest('.zoom-toolbar')) return;
      isPanning = true;
      panStart = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
      canvasViewport.classList.add('grabbing');
    });

    // Drawer Toggle
    drawerToggleBtn.addEventListener('click', () => {
      const isCollapsed = codeDrawer.classList.toggle('collapsed');
      drawerToggleIcon.textContent = isCollapsed ? '▲ Open' : '▼ Close';
    });

    // JSON Input Syncer
    codeTextarea.addEventListener('input', () => {
      try {
        diagramState = JSON.parse(codeTextarea.value);
        renderCanvas();
      } catch(e) {}
    });

    // Templates Switcher
    selectTemplate.addEventListener('change', () => {
      const t = TEMPLATES[selectTemplate.value];
      if (t) {
        diagramState = JSON.parse(JSON.stringify(t));
        selectedElement = null;
        renderCanvas();
        showToast(`Loaded ${selectTemplate.value} template`);
      }
    });

    // Actions & Exporters
    document.getElementById('btn-new').addEventListener('click', () => {
      diagramState = { containers: [], nodes: [], edges: [] };
      selectedElement = null;
      renderCanvas();
      showToast('Created new diagram');
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(diagramState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'architecture-diagram.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloaded diagram JSON');
    });

    document.getElementById('btn-share-url').addEventListener('click', () => {
      const encoded = encodeURIComponent(JSON.stringify(diagramState));
      const url = `${window.location.origin}${window.location.pathname}#state=${encoded}`;
      navigator.clipboard.writeText(url).then(() => showToast('Share link copied to clipboard!'));
    });

    document.getElementById('btn-copy-mermaid').addEventListener('click', () => {
      let mm = 'graph TD\n';
      diagramState.nodes.forEach(n => {
        mm += `  ${n.id}["${n.icon} ${n.title}"]\n`;
      });
      diagramState.edges.forEach(e => {
        if (e.label) mm += `  ${e.from} -- "${e.label}" --> ${e.to}\n`;
        else mm += `  ${e.from} --> ${e.to}\n`;
      });
      navigator.clipboard.writeText(mm).then(() => showToast('Copied Mermaid flowchart code!'));
    });

    document.getElementById('btn-export-svg').addEventListener('click', () => {
      // Build standalone SVG from nodes, containers, and edges
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
        <rect width="100%" height="100%" fill="#ffffff" />
        <g id="containers">`;

      diagramState.containers.forEach(c => {
        svg += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" />
                <text x="${c.x + 12}" y="${c.y + 20}" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#475569">${c.title}</text>`;
      });

      svg += `</g><g id="edges">`;
      diagramState.edges.forEach(e => {
        const fn = diagramState.nodes.find(n => n.id === e.from);
        const tn = diagramState.nodes.find(n => n.id === e.to);
        if (fn && tn) {
          svg += `<line x1="${fn.x+70}" y1="${fn.y+35}" x2="${tn.x+70}" y2="${tn.y+35}" stroke="#475569" stroke-width="2" />
                  ${e.label ? `<text x="${(fn.x+tn.x)/2 + 70}" y="${(fn.y+tn.y)/2 + 30}" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">${e.label}</text>` : ''}`;
        }
      });

      svg += `</g><g id="nodes">`;
      diagramState.nodes.forEach(n => {
        svg += `<rect x="${n.x}" y="${n.y}" width="140" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                <text x="${n.x + 70}" y="${n.y + 26}" font-size="18" text-anchor="middle">${n.icon}</text>
                <text x="${n.x + 70}" y="${n.y + 44}" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">${n.title}</text>
                <text x="${n.x + 70}" y="${n.y + 58}" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748b" text-anchor="middle">${n.sub}</text>`;
      });

      svg += `</g></svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'architecture-diagram.svg';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloaded architecture-diagram.svg');
    });

    document.getElementById('btn-export-png').addEventListener('click', () => {
      // Rasterize to canvas
      const canvas = document.createElement('canvas');
      canvas.width = 2400; // 2x
      canvas.height = 1600;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(2, 2);

      // Containers
      diagramState.containers.forEach(c => {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(c.x, c.y, c.w, c.h);
        ctx.setLineDash([]);
        ctx.fillStyle = '#475569';
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.fillText(c.title, c.x + 12, c.y + 20);
      });

      // Edges
      diagramState.edges.forEach(e => {
        const fn = diagramState.nodes.find(n => n.id === e.from);
        const tn = diagramState.nodes.find(n => n.id === e.to);
        if (fn && tn) {
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(fn.x + 70, fn.y + 35);
          ctx.lineTo(tn.x + 70, tn.y + 35);
          ctx.stroke();

          if (e.label) {
            ctx.fillStyle = '#ffffff';
            const mx = (fn.x + tn.x) / 2 + 70;
            const my = (fn.y + tn.y) / 2 + 35;
            ctx.fillRect(mx - 30, my - 10, 60, 20);
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(e.label, mx, my + 4);
            ctx.textAlign = 'left';
          }
        }
      });

      // Nodes
      diagramState.nodes.forEach(n => {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(n.x, n.y, 140, 70);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(n.x, n.y, 140, 70);
        ctx.textAlign = 'center';
        ctx.font = '18px sans-serif';
        ctx.fillText(n.icon, n.x + 70, n.y + 26);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.fillText(n.title, n.x + 70, n.y + 44);
        ctx.fillStyle = '#64748b';
        ctx.font = '9px JetBrains Mono, monospace';
        ctx.fillText(n.sub, n.x + 70, n.y + 58);
        ctx.textAlign = 'left';
      });

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'architecture-diagram.png';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded architecture-diagram.png (2x)');
      });
    });

    // Initial Load & URL Hash Restorer
    const hash = window.location.hash;
    if (hash.startsWith('#state=')) {
      try {
        diagramState = JSON.parse(decodeURIComponent(hash.substring(7)));
      } catch(e) {}
    } else {
      const saved = localStorage.getItem('arch_diagram_autosave');
      if (saved) {
        try {
          diagramState = JSON.parse(saved);
        } catch(e) {}
      }
    }

    renderPalette();
    renderCanvas();
    applyTransform();
  </script>
</body>
</html>
