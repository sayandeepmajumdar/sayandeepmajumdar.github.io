<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Mathlify</title>
  <meta name="description" content="The page you are looking for was not found.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">

  <!-- Zero-Flicker Theme Initialization -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("theme-mode") || localStorage.getItem("toolbox:theme") || localStorage.getItem("calchub-theme");
        var isDark = mode === "dark" || (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <!-- Redirect to SPA router -->
  <script>
    const path = window.location.pathname.replace(/^\/mathlify/, '');
    if (path && path !== '/' && path !== '/index.html') {
      window.location.replace('/mathlify/#' + path);
    }
  </script>
</head>
<body>
  <div class="site-wrapper">
    <div class="not-found">
      <div class="not-found__code">404</div>
      <h1 class="not-found__title">Calculator Not Found</h1>
      <p class="not-found__desc">The page or tool you're looking for doesn't exist.</p>
      <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
        <a href="/mathlify/" class="btn btn--primary">Back to Mathlify</a>
        <a href="/" class="btn btn--ghost">Portfolio (sayandeep.dev)</a>
      </div>
    </div>
  </div>
</body>
</html>
