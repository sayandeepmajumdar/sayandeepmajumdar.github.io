  <script>

      // List of tools that were relocated under /tools/

        "hash-generator", "html-formatter", "html-to-markdown", "http-status-codes",
        "image-metadata-viewer", "invoice-generator", "jpg-png-converter", "js-formatter",
        "json-formatter", "json-to-csv", "jwt-decoder", "lorem-ipsum", "markdown-editor",
        "mermaid-editor", "meta-tag-generator", "neural-network-visualizer", "password-generator", "pdf-compressor",
        "qr-code-generator", "quotation-generator", "react-playground", "receipt-generator",
        "regex-generator", "regex-tester", "rsa-generator", "seo-content-checker",
        "sitemap-generator", "snippet-manager", "sql-builder", "sql-formatter",
        "sql-playground", "sql-visualizer", "svg-editor", "svg-optimizer", "svg-to-png",

        "vcard-qr-generator", "vue-playground", "websocket-tester", "wifi-qr-generator",
        "xml-formatter", "xml-to-json", "yaml-formatter"
      ]);

      var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
      var segments = path.split('/');
      var firstSegment = segments[0];

      // If legacy tool route at root (e.g. /json-formatter/ or /json-formatter)
      if (tools.has(firstSegment)) {
        var rest = segments.slice(1).join('/');
        var target = '/tools/' + firstSegment + '/' + (rest ? rest + (window.location.search || '') : (window.location.search || ''));
        window.location.replace(target);
        return;
      }
    })();
  </script>

    :root {

    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
  </style>
</head>
